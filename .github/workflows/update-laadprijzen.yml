name: Volvo Reisplanner - NDW laadprijzen

  on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  download-laadprijzen:
    runs-on: ubuntu-latest

    steps:
      - name: Bestanden ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: NDW-download testen
        run: python scripts/update_laadprijzen.py
      - name: Laadprijzen opslaan in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Automatische update NDW-laadprijzen"
            git push
          else
            echo "Geen wijzigingen om op te slaan."
          fi
